# =========================================================
# NightDrop - Spring Boot Application Configuration
# =========================================================

spring.application.name=nightdrop-backend


# =========================================================
# SERVER CONFIGURATION
# =========================================================

server.port=${PORT:${SERVER_PORT:8080}}


# =========================================================
# MYSQL DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nightdrop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}

spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}

spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Charan@721}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA AND HIBERNATE CONFIGURATION
# =========================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# JWT SECURITY CONFIGURATION
# =========================================================

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

app.jwt.expiration-ms=604800000


# =========================================================
# CORS CONFIGURATION
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}


# =========================================================
# ACTUATOR HEALTH CHECK
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always